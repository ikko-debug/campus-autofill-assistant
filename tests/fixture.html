<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Autofill fixture</title></head>
<body>
  <section id="basic">
    <input placeholder="请输入姓名">
    <input placeholder="请填写您的手机号码">
    <textarea placeholder="请输入描述内容"></textarea>
  </section>
  <section class="info_list" id="internship-b">
    <h2>实习经历-1</h2>
    <input placeholder="请输入实习公司" value="乙公司">
    <input placeholder="请输入职位">
    <input placeholder="选择日期">
    <input placeholder="选择日期">
    <label><input type="checkbox">至今</label>
    <textarea placeholder="请输入描述内容"></textarea>
  </section>
  <section class="info_list" id="internship-a">
    <h2>实习经历-2</h2>
    <input placeholder="请输入实习公司">
    <input placeholder="请输入职位">
    <input placeholder="选择日期">
    <input placeholder="选择日期">
    <label><input type="checkbox">至今</label>
    <textarea placeholder="请输入描述内容"></textarea>
  </section>
  <script src="../content/common.js"></script>
  <script src="../content/tencent.js"></script>
  <pre id="test-result">pending</pre>
  <script>
    (async () => {
      try {
        document.querySelector('#internship-b input[type="checkbox"]').checked = true;
        const profile = {
          personal: { name: "测试姓名", phone: "13800000000" },
          intent: {}, contacts: {}, education: [], projects: [], awards: [], additional: {},
          internships: [
            { company: "甲公司", role: "甲职位", startDate: "2026-06-01", endDate: "", current: true, description: "甲描述" },
            { company: "乙公司", role: "乙职位", startDate: "2025-06-01", endDate: "2025-09-01", current: false, description: "乙描述" }
          ],
          settings: { allowCustomDropdowns: false }
        };
        const report = await CampusAutofillTencent.fill(profile, { overwrite: false });
        const preservedExistingCurrent = document.querySelector('#internship-b input[type="checkbox"]').checked;
        const overwriteReport = await CampusAutofillTencent.fill(profile, { overwrite: true });
        const values = [...document.querySelectorAll("input[placeholder],textarea[placeholder]")]
          .map((element) => [element.placeholder, element.value]);
        const actual = {
          values,
          firstChecked: document.querySelector('#internship-b input[type="checkbox"]').checked,
          secondChecked: document.querySelector('#internship-a input[type="checkbox"]').checked,
          preservedExistingCurrent
        };
        const pass = values.some(([placeholder, value]) => placeholder === "请输入职位" && value === "乙职位")
          && values.some(([placeholder, value]) => placeholder === "请输入职位" && value === "甲职位")
          && actual.preservedExistingCurrent === true
          && actual.firstChecked === false
          && actual.secondChecked === true;
        document.getElementById("test-result").textContent = `${pass ? "PASS" : "FAIL"} ${JSON.stringify({ actual, report, overwriteReport })}`;
      } catch (error) {
        document.getElementById("test-result").textContent = `ERROR: ${error.stack || error.message}`;
      }
    })();
  </script>
</body>
</html>
