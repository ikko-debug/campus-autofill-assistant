<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>编辑本地资料 - 秋招填表助手</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="options-shell">
    <header class="options-header">
      <div>
        <p class="eyebrow">LOCAL PROFILE</p>
        <h1>秋招本地资料</h1>
        <p class="muted">默认资料来自你提供的 PDF；空缺信息请在下方补充。所有内容仅存储在本机 Chrome。</p>
      </div>
      <div class="header-actions">
        <button id="export" class="secondary">导出 JSON</button>
        <label class="file-button">导入 JSON<input id="import" type="file" accept="application/json"></label>
        <button id="save" class="primary">保存资料</button>
      </div>
    </header>

    <section class="panel">
      <h2>基础与补充信息</h2>
      <div class="form-grid">
        <label>姓名<input data-path="personal.name"></label>
        <label>性别<input data-path="personal.gender"></label>
        <label>出生日期<input data-path="personal.birthDate" placeholder="YYYY-MM-DD 或 YYYY-MM"></label>
        <label>民族<input data-path="personal.nation"></label>
        <label>婚否<input data-path="personal.maritalStatus"></label>
        <label>健康状况<input data-path="personal.health"></label>
        <label>籍贯<input data-path="personal.nativePlace"></label>
        <label>手机号<input data-path="personal.phone"></label>
        <label>邮箱<input data-path="personal.email"></label>
        <label>微信号<input data-path="personal.wechat"></label>
        <label>QQ 号<input data-path="personal.qq"></label>
        <label>身份证号<input data-path="personal.idNumber" autocomplete="off"></label>
        <label>证件类型<input data-path="personal.idType"></label>
        <label>手机国家代码<input data-path="personal.phoneCountryCode"></label>
        <label>当前所在地<input data-path="personal.currentLocation" placeholder="如：中国大陆 / 四川省 / 成都市"></label>
        <label>个人主页<input data-path="personal.website"></label>
        <label>期望城市（逗号分隔）<input data-path="intent.desiredCities" data-array="true"></label>
        <label>面试城市<input data-path="intent.interviewCity"></label>
        <label>紧急联系人<input data-path="contacts.emergencyName"></label>
        <label>紧急联系人电话<input data-path="contacts.emergencyPhone"></label>
        <label>资料证明人<input data-path="contacts.referenceName"></label>
        <label>证明人身份<input data-path="contacts.referenceRole"></label>
        <label>证明人电话<input data-path="contacts.referencePhone"></label>
        <label>感兴趣事业群<input data-path="intent.businessGroup"></label>
        <label>期望薪酬<input data-path="intent.expectedSalary"></label>
      </div>
    </section>

    <section class="panel">
      <div class="section-heading"><h2>教育经历</h2><button data-add="education" class="small">添加</button></div>
      <div id="education-list" class="record-list"></div>
    </section>
    <section class="panel">
      <div class="section-heading"><h2>实习经历</h2><button data-add="internships" class="small">添加</button></div>
      <div id="internships-list" class="record-list"></div>
    </section>
    <section class="panel">
      <div class="section-heading"><h2>项目经历</h2><button data-add="projects" class="small">添加</button></div>
      <div id="projects-list" class="record-list"></div>
    </section>
    <section class="panel">
      <div class="section-heading"><h2>获奖信息</h2><button data-add="awards" class="small">添加</button></div>
      <div id="awards-list" class="record-list"></div>
    </section>

    <section class="panel">
      <h2>其他信息</h2>
      <div class="form-grid one-column">
        <label>常用 AI 工具<textarea data-path="additional.aiTools"></textarea></label>
        <label>AI 协作项目说明<textarea data-path="additional.aiProject"></textarea></label>
        <label>自我介绍 / 补充信息<textarea data-path="additional.selfIntroduction"></textarea></label>
        <label>兴趣爱好<textarea data-path="additional.hobbies"></textarea></label>
        <label>专利成果<textarea data-path="additional.patents"></textarea></label>
      </div>
      <label class="check-row"><input type="checkbox" data-path="settings.fillOnlyEmpty"><span>默认仅填写空字段</span></label>
      <label class="check-row"><input type="checkbox" data-path="settings.allowCustomDropdowns"><span>尝试填写自定义下拉框</span></label>
    </section>
    <div id="save-status" class="save-status" aria-live="polite"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
